services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daocoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-daocoin}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-daocoin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-daocoin}?sslmode=disable
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      RESEND_VERIFICATION_ENABLED: "true"
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      EMAIL_RATE_LIMIT_HMAC_SECRET: ${EMAIL_RATE_LIMIT_HMAC_SECRET:-fedcba9876543210fedcba9876543210}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail_smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-medubaiso1@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-medubaiso1@gmail.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CHIPCOIN | Xác thực tài khoản}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      APP_PUBLIC_URL: ${PUBLIC_WEB_URL:-https://chipcoin.io}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-15}
      EMAIL_RESEND_COOLDOWN_SECONDS: ${EMAIL_RESEND_COOLDOWN_SECONDS:-60}
      EMAIL_RESEND_MAX_PER_HOUR: ${EMAIL_RESEND_MAX_PER_HOUR:-3}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  pgdata:
